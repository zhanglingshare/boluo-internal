name: Internal Lab | Demo, Models & API
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit and API tests
        run: python -m pytest -q
      - name: Check forbidden private artifacts
        shell: bash
        run: |
          ! git ls-files | grep -E '(^|/)(\.runtime|private-data|\.env)(/|$)'
          ! git ls-files | grep -E '\.(sav|xlsx|xls|sqlite|db|pem|key)$'
