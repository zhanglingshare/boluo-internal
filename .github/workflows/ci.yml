name: Internal Lab | Demo, Models & API
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit and API tests
        run: python -m pytest -q
      - name: Check JavaScript syntax
        run: node --check web/app.js
      - name: Check forbidden private artifacts
        shell: bash
        run: |
          ! git ls-files | grep -E '(^|/)(\.runtime|private-data|\.env)(/|$)'
          ! git ls-files | grep -E '\.(sav|xlsx|xls|sqlite|db|pem|key)$'
      - name: Install browser testing tools
        run: |
          python -m pip install playwright
          python -m playwright install chromium
      - name: Run desktop and mobile smoke tests
        run: python tests/browser_smoke.py
      - name: Save private UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internal-lab-demo-visual
          path: artifacts/browser/
          retention-days: 7
          if-no-files-found: ignore
