name: Online lab checks
on:
  push:
    paths:
      - "index.html"
      - "engine.js"
      - "lab.js"
      - "research-core.js"
      - "research-viz.js"
      - "research-v3.js"
      - "research-v3-viz.js"
      - "research-v4.js"
      - "research-v4-viz.js"
      - "research-cards.js"
      - "research-discovery.js"
      - "research-observation-template.csv"
      - "docs/V6-DATA-CONTRACT.md"
      - "tests/research-cards.test.cjs"
      - "lab.css"
      - "tests/browser-engine.test.cjs"
      - "tests/lab-render.test.cjs"
      - "tests/research-methods.test.cjs"
      - "tests/research-v3.test.cjs"
      - "tests/research-v4.test.cjs"
      - ".github/workflows/pages-interactive.yml"
  pull_request:
    paths:
      - "index.html"
      - "engine.js"
      - "lab.js"
      - "research-core.js"
      - "research-viz.js"
      - "research-v3.js"
      - "research-v3-viz.js"
      - "research-v4.js"
      - "research-v4-viz.js"
      - "research-cards.js"
      - "tests/research-cards.test.cjs"
      - "lab.css"
      - "tests/browser-engine.test.cjs"
      - "tests/lab-render.test.cjs"
      - "tests/research-methods.test.cjs"
      - "tests/research-v3.test.cjs"
      - "tests/research-v4.test.cjs"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check engine.js
      - run: node --check lab.js
      - run: node --check research-core.js
      - run: node --check research-viz.js
      - run: node --check research-v3.js
      - run: node --check research-v3-viz.js
      - run: node --check research-v4.js
      - run: node --check research-v4-viz.js
      - run: node --check research-cards.js
      - run: node --check research-discovery.js
      - run: node --test tests/*.test.cjs
      - name: Protect prior mockups
        run: |
          test -f mockups/final_054b.html
