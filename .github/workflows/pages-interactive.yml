name: Online lab checks
on:
  push:
    paths:
      - "index.html"
      - "engine.js"
      - "lab.js"
      - "research-core.js"
      - "research-viz.js"
      - "research-v3.js"
      - "research-v3-viz.js"
      - "research-v4.js"
      - "research-v4-viz.js"
      - "research-v5.js"
      - "research-v5-viz.js"
      - "research-v5-ui.js"
      - "survey-evidence-v1.js"
      - "survey-bridge-v1.js"
      - "survey-bridge-ui-v1.js"
      - "presentation-v6.js"
      - "data/survey-summary.json"
      - "lab.css"
      - "tests/browser-engine.test.cjs"
      - "tests/lab-render.test.cjs"
      - "tests/research-methods.test.cjs"
      - "tests/research-v3.test.cjs"
      - "tests/research-v4.test.cjs"
      - "tests/research-v5.test.cjs"
      - "tests/survey-bridge.test.cjs"
      - ".github/workflows/pages-interactive.yml"
  pull_request:
    paths:
      - "index.html"
      - "engine.js"
      - "lab.js"
      - "research-core.js"
      - "research-viz.js"
      - "research-v3.js"
      - "research-v3-viz.js"
      - "research-v4.js"
      - "research-v4-viz.js"
      - "research-v5.js"
      - "research-v5-viz.js"
      - "research-v5-ui.js"
      - "survey-evidence-v1.js"
      - "survey-bridge-v1.js"
      - "survey-bridge-ui-v1.js"
      - "presentation-v6.js"
      - "data/survey-summary.json"
      - "lab.css"
      - "tests/browser-engine.test.cjs"
      - "tests/lab-render.test.cjs"
      - "tests/research-methods.test.cjs"
      - "tests/research-v3.test.cjs"
      - "tests/research-v4.test.cjs"
      - "tests/research-v5.test.cjs"
      - "tests/survey-bridge.test.cjs"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check engine.js
      - run: node --check lab.js
      - run: node --check research-core.js
      - run: node --check research-viz.js
      - run: node --check research-v3.js
      - run: node --check research-v3-viz.js
      - run: node --check research-v4.js
      - run: node --check research-v4-viz.js
      - run: node --check research-v5.js
      - run: node --check research-v5-viz.js
      - run: node --check research-v5-ui.js
      - run: node --check survey-evidence-v1.js
      - run: node --check survey-bridge-v1.js
      - run: node --check survey-bridge-ui-v1.js
      - run: node --check presentation-v6.js
      - run: node --test tests/*.test.cjs
      - name: Protect prior mockups
        run: |
          test -f mockups-portal.html
          test -f mockups/final_054b.html
          test -f web/index.html
