<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>博罗产业风洞 · 智能体议事厅工作台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='10' fill='%232E7FD6'/><path d='M7 14l3-3 3 2 4-5' stroke='white' stroke-width='2' fill='none' stroke-linecap='round'/></svg>">
<style>
:root{
  --ink:#16324f; --ink-2:#5b7390; --ink-3:#8aa0b8;
  --blue:#0a84ff; --blue-d:#2e7fd6;
  --line:rgba(28,78,138,.12); --line-2:rgba(28,78,138,.2);
  --glass:rgba(255,255,255,.62); --glass-2:rgba(255,255,255,.72);
  --shadow:0 24px 60px rgba(20,48,90,.28); --shadow-sm:0 3px 12px rgba(24,60,110,.1);
  --r:18px; --r-sm:11px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);color:var(--ink);
  background:url("assets/sky-bg.png") center/cover fixed no-repeat,linear-gradient(180deg,#d7e7f8,#f7fbff);
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(232,242,252,.55),rgba(247,251,255,.35));pointer-events:none}

/* 悬浮窗口 */
.window{
  position:relative;z-index:1;height:calc(100vh - 44px);margin:22px auto;max-width:1560px;
  display:flex;flex-direction:column;border-radius:var(--r);overflow:hidden;
  background:var(--glass);
  -webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);
  border:1px solid rgba(255,255,255,.8);box-shadow:var(--shadow);
}
/* 标题栏 */
.titlebar{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line)}
.lights{display:flex;gap:8px}.lights i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.12)}
.lights i:nth-child(1){background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.tb-menu{font-size:13px;color:var(--ink-2);font-weight:500}
.ws-pill{margin:0 auto;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.9);border-radius:9px;padding:6px 14px;font-size:13px;font-weight:600;box-shadow:var(--shadow-sm)}
.ws-pill .logo{width:20px;height:20px;border-radius:6px;background:linear-gradient(135deg,#3d8ff0,#1e6fba);display:grid;place-items:center}
.tb-icons{display:flex;gap:6px}
.tb-icons button{width:32px;height:32px;border-radius:9px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer}
.tb-icons button:hover{background:rgba(28,78,138,.08)}
.tb-icons svg{width:18px;height:18px;stroke:var(--ink-2);fill:none;stroke-width:1.8}
.tb-icons .more{background:var(--blue);width:32px}.tb-icons .more svg{stroke:#fff}

.workbench{flex:1;min-height:0;display:grid;grid-template-columns:242px minmax(0,1fr) 344px}

/* 左栏 */
.sidebar{padding:16px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto}
.search{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.9);border-radius:10px;padding:8px 11px;margin-bottom:14px}
.search svg{width:15px;height:15px;stroke:var(--ink-3);fill:none;stroke-width:2}
.search input{border:0;background:transparent;outline:none;font-family:var(--font);font-size:12.5px;color:var(--ink);width:100%}
.nav-item{display:flex;align-items:center;gap:11px;border:0;background:transparent;padding:9px 11px;border-radius:10px;font-family:var(--font);font-size:13px;color:var(--ink-2);cursor:pointer;text-align:left;transition:.15s;margin-bottom:2px}
.nav-item svg{width:18px;height:18px;stroke:var(--ink-3);fill:none;stroke-width:1.8}
.nav-item:hover{background:rgba(46,127,214,.1)}
.nav-item.active{background:linear-gradient(135deg,#2e7fd6,#1e6fba);color:#fff;box-shadow:0 5px 14px rgba(46,127,214,.35)}
.nav-item.active svg{stroke:#fff}
.nav-item .cnt{margin-left:auto;font-size:11px;background:rgba(28,78,138,.1);padding:1px 7px;border-radius:8px}
.nav-item.active .cnt{background:rgba(255,255,255,.25)}
.tag-sec{margin-top:auto;padding-top:16px}
.tag-sec .ts-head{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-3);margin-bottom:9px}
.tag-sec .tg{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);padding:4px 0}
.tag-sec .d{width:8px;height:8px;border-radius:50%}

/* 中栏 */
.main{display:flex;flex-direction:column;min-height:0}
.main-top{display:flex;align-items:center;gap:14px;padding:14px 20px 8px}
.seg{display:flex;background:rgba(28,78,138,.09);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;font-family:var(--font);font-size:12.5px;font-weight:600;color:var(--ink-2);padding:6px 15px;border-radius:8px;cursor:pointer}
.seg button.on{background:#fff;color:var(--blue-d);box-shadow:var(--shadow-sm)}
.main-meta{margin:0 auto;font-size:11.5px;color:var(--ink-3);display:flex;gap:10px;align-items:center}
.ai-btn{display:flex;align-items:center;gap:6px;border:0;background:rgba(46,127,214,.12);color:var(--blue-d);font-family:var(--font);font-size:12px;font-weight:600;padding:7px 13px;border-radius:9px;cursor:pointer}
.main-title{padding:4px 20px 12px}
.main-title h1{font-size:22px;font-weight:800;letter-spacing:-.3px}
.main-title p{font-size:12.5px;color:var(--ink-3);margin-top:3px}

.stream{flex:1;overflow-y:auto;padding:6px 20px 12px;position:relative}
.stream::-webkit-scrollbar{width:8px}.stream::-webkit-scrollbar-thumb{background:rgba(28,78,138,.18);border-radius:8px}
.feed{position:relative;padding-left:26px}
.feed:before{content:"";position:absolute;left:9px;top:14px;bottom:14px;width:2px;background:linear-gradient(var(--blue-d),rgba(46,127,214,.15))}
.msg{position:relative;background:var(--glass-2);border:1px solid rgba(255,255,255,.9);border-radius:14px;padding:14px 16px;margin-bottom:14px;cursor:pointer;box-shadow:var(--shadow-sm);transition:.15s}
.msg:before{content:"";position:absolute;left:-22px;top:20px;width:11px;height:11px;border-radius:50%;background:var(--blue-d);border:2px solid #fff;box-shadow:0 0 0 2px rgba(46,127,214,.3)}
.msg:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(24,60,110,.16)}
.msg.sel{outline:2px solid var(--blue);outline-offset:1px}
.msg-grid{display:flex;gap:14px}
.msg-body{flex:1;min-width:0}
.msg-head{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.avatar svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2}
.who b{font-size:13.5px;display:block}.who small{font-size:11px;color:var(--ink-3)}
.badge{margin-left:auto;display:flex;align-items:center;gap:7px}
.dot-badge{font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.dot-badge:before{content:"";width:8px;height:8px;border-radius:50%}
.grade-pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:8px}
.stmt{font-size:14.5px;font-weight:700;line-height:1.5}
.src{font-size:11.5px;color:var(--ink-3);margin-top:4px}
.det{font-size:12.5px;line-height:1.6;color:var(--ink-2);margin-top:7px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:11px;font-weight:600;padding:3px 9px;border-radius:8px;background:rgba(28,78,138,.08);color:var(--ink-2)}
.msg-actions{display:flex;gap:18px;margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}
.act{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3);border:0;background:none;cursor:pointer;font-family:var(--font)}
.act svg{width:15px;height:15px;stroke:var(--ink-3);fill:none;stroke-width:1.8}
.act.reply{color:var(--blue-d)}.act.reply svg{stroke:var(--blue-d)}
/* 缩略数据卡 */
.thumb{width:128px;flex:none;background:linear-gradient(150deg,#f3f8ff,#e6f0fc);border:1px solid rgba(46,127,214,.18);border-radius:11px;padding:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.thumb .ring{width:46px;height:46px}
.thumb .ring circle{fill:none;stroke-width:7}
.thumb .tn{font-size:11px;font-weight:700;color:var(--blue-d)}
.thumb .ts{font-size:10px;color:var(--ink-3)}
.composer{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.95);border-radius:13px;padding:9px 12px;margin-top:2px}
.composer .plus{width:34px;height:34px;border-radius:50%;background:var(--blue);border:0;display:grid;place-items:center;flex:none}
.composer .plus svg{stroke:#fff;fill:none;stroke-width:2.4;width:18px;height:18px}
.composer input{flex:1;border:0;background:transparent;outline:none;font-family:var(--font);font-size:13px;color:var(--ink-2)}
.composer .mic{width:34px;height:34px;border-radius:50%;background:var(--blue-d);border:0;display:grid;place-items:center}
.composer .mic svg{stroke:#fff;fill:none;stroke-width:2;width:16px;height:16px}

/* 关系图 */
.graph-wrap{flex:1;position:relative;display:none;padding:10px 16px}
.graph-wrap.on{display:block}
.graph-wrap svg{width:100%;height:100%}
.gedge{stroke:var(--line-2);stroke-width:1.4;fill:none;marker-end:url(#arrow)}
.gnode{cursor:pointer}.gnode circle{fill:#fff;stroke-width:2.2}
.gnode text{font-size:10px;fill:var(--ink);font-weight:600}
.gnode.sel circle{stroke:var(--blue);stroke-width:3.4}

/* 右栏 */
.inspector{border-left:1px solid var(--line);overflow-y:auto;padding:18px}
.inspector::-webkit-scrollbar{width:8px}.inspector::-webkit-scrollbar-thumb{background:rgba(28,78,138,.18);border-radius:8px}
.insp-sec{margin-bottom:22px}
.insp-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px}
.insp-head h3{font-size:14px;font-weight:700}.insp-head a{font-size:11px;color:var(--blue-d);text-decoration:none}
.donut-wrap{display:flex;align-items:center;gap:16px}
.legend{font-size:12px}.legend div{display:flex;align-items:center;gap:7px;margin-bottom:7px;color:var(--ink-2)}
.legend .dot{width:9px;height:9px;border-radius:3px}
.rt-cards{display:flex;gap:8px}
.rt-card{flex:1;border-radius:11px;padding:10px 9px;border:1px solid;cursor:pointer}
.rt-card b{font-size:12px;display:block;margin-bottom:4px}
.rt-card small{font-size:10.5px;line-height:1.4;display:block}
.rt-card .n{font-size:10.5px;font-weight:700;margin-top:6px;display:block}
.tl{position:relative;padding-left:18px}
.tl:before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:rgba(28,78,138,.14)}
.tl-item{position:relative;padding-bottom:13px}
.tl-item:before{content:"";position:absolute;left:-17px;top:3px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--blue-d)}
.tl-item b{font-size:12px;display:block}.tl-item small{font-size:11px;color:var(--ink-3)}
.check{display:flex;align-items:flex-start;gap:10px;background:linear-gradient(135deg,#eaf2fe,#f4f9ff);border:1px solid rgba(46,127,214,.2);border-radius:12px;padding:12px}
.check .cb{width:18px;height:18px;border-radius:6px;border:2px solid var(--blue-d);flex:none;margin-top:1px}
.check b{font-size:12.5px;display:block}.check small{font-size:11px;color:var(--ink-3);margin-top:3px;display:block}
.ev-cards{display:flex;gap:8px}
.ev-card{flex:1;background:linear-gradient(150deg,#f3f8ff,#e6f0fc);border:1px solid rgba(46,127,214,.18);border-radius:11px;padding:10px 8px;text-align:center}
.ev-card svg{width:22px;height:22px;stroke:var(--blue-d);fill:none;stroke-width:1.8;margin-bottom:6px}
.ev-card small{font-size:10px;color:var(--ink-2);word-break:break-all}

/* 底栏 */
.bottombar{display:flex;align-items:center;gap:8px;padding:10px 18px;border-top:1px solid var(--line)}
.bb-btn{display:flex;align-items:center;gap:7px;border:0;background:transparent;font-family:var(--font);font-size:12.5px;color:var(--ink-2);padding:7px 12px;border-radius:9px;cursor:pointer}
.bb-btn svg{width:16px;height:16px;stroke:var(--ink-2);fill:none;stroke-width:1.8}
.bb-btn:hover{background:rgba(28,78,138,.08)}
.bb-btn.primary{background:linear-gradient(135deg,#2e7fd6,#1e6fba);color:#fff}.bb-btn.primary svg{stroke:#fff}
.bb-stats{margin-left:auto;font-size:11.5px;color:var(--ink-3);display:flex;gap:12px;align-items:center}

/* 移动端 */
.mobile-tab,.sheet-handle,.m-top{display:none}
@media (max-width:900px){
  body{overflow:auto}
  body:before{display:none}
  .window{height:auto;min-height:100vh;margin:0;border-radius:0;border:0;overflow:visible;-webkit-backdrop-filter:none;backdrop-filter:none}
  .titlebar .tb-menu,.ws-pill,.tb-icons{display:none}
  .titlebar{padding:12px 16px}
  .workbench{display:flex;flex-direction:column}
  .sidebar,.bottombar{display:none}
  .m-top{display:flex;align-items:center;gap:10px;padding:12px 16px;position:sticky;top:0;z-index:20;background:rgba(255,255,255,.82);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
  .m-top b{font-size:16px;flex:1}
  .main{min-height:calc(100vh - 52px)}
  .stream{padding:6px 14px 90px}
  .thumb{display:none}
  .inspector{position:fixed;left:0;right:0;bottom:0;z-index:40;max-height:80vh;border-radius:18px 18px 0 0;transform:translateY(100%);transition:transform .28s;box-shadow:0 -12px 40px rgba(24,60,110,.25);padding-top:0;background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)}
  .inspector.open{transform:translateY(0)}
  .sheet-handle{display:block;width:42px;height:4px;border-radius:4px;background:rgba(28,78,138,.25);margin:10px auto 0}
  .mobile-tab{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.88);backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:6px 0 env(safe-area-inset-bottom)}
  .mobile-tab button{flex:1;border:0;background:none;font-family:var(--font);font-size:10.5px;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:3px}
  .mobile-tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8}
  .mobile-tab button.on{color:var(--blue-d)}
}
</style>
</head>

  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.5-7-9.5A3.5 3.5 0 0112 7a3.5 3.5 0 017 3.5C19 15.5 12 20 12 20z"/></symbol>

</svg>

<div class="window">
  <div class="titlebar">
    <span class="lights"><i></i><i></i><i></i></span>
    <span class="tb-menu">显示</span><span class="tb-menu">视图</span>
    <span class="ws-pill"><span class="logo"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><path d="M4 12c2-4 6-4 8 0s6 4 8 0"/></svg></span>天空 · 洞察工作区</span>
    <span class="tb-icons">
      <button><svg><use href="#i-share" xlink:href="#i-share"/></svg></button>
      <button><svg><use href="#i-filter" xlink:href="#i-filter"/></svg></button>
      <button><svg><use href="#i-funnel" xlink:href="#i-funnel"/></svg></button>
      <button><svg><use href="#i-search" xlink:href="#i-search"/></svg></button>
      <button class="more"><svg><use href="#i-more" xlink:href="#i-more"/></svg></button>
    </span>
  </div>

  <div class="workbench">
    <aside class="sidebar">
      <div class="search"><svg><use href="#i-search" xlink:href="#i-search"/></svg><input placeholder="搜索消息 / 证据…"></div>
      <button class="nav-item" data-nav="all"><svg><use href="#i-run" xlink:href="#i-run"/></svg>运行记录</button>
      <button class="nav-item" data-nav="evidence"><svg><use href="#i-db" xlink:href="#i-db"/></svg>证据库</button>
      <div id="agentNav" style="margin-top:6px"></div>
      <div class="tag-sec">
        <div class="ts-head"><span>标签</span><span>···</span></div>
        <div class="tg"><span class="d" style="background:#e0644b"></span>重要</div>
        <div class="tg"><span class="d" style="background:#d9a441"></span>观察</div>
        <div class="tg"><span class="d" style="background:#2e7fd6"></span>待验</div>
        <div class="tg"><span class="d" style="background:#8aa0b8"></span>置信度</div>
      </div>
    </aside>

    <section class="main">
      <div class="main-top">
        <div class="seg"><button id="tabStream" class="on">争论流</button><button id="tabGraph">关系图</button></div>
        <span class="main-meta"><svg width="14" height="14" style="stroke:#8aa0b8;fill:none;stroke-width:2"><use href="#i-sync" xlink:href="#i-sync"/></svg>空中同步 · 真实 run</span>
        <button class="ai-btn"><svg width="14" height="14" style="stroke:#2e7fd6;fill:none;stroke-width:2"><path d="M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/></svg>AI 分析</button>
      </div>
      <div class="main-title"><h1 id="qTitle"></h1><p>基于证据链的观点演化与关键冲突 · 异见显式保留，不平均成假确定</p></div>
      <div class="stream" id="stream"></div>
      <div class="graph-wrap" id="graphWrap"><svg id="graphSvg"></svg></div>
    </section>

    <aside class="inspector" id="inspector"><div class="sheet-handle"></div><div id="inspBody"></div></aside>
  </div>

  <div class="bottombar">
    <button class="bb-btn"><svg><use href="#i-plus" xlink:href="#i-plus"/></svg>新建</button>
    <button class="bb-btn"><svg><use href="#i-doc" xlink:href="#i-doc"/></svg>导入</button>
    <button class="bb-btn"><svg><use href="#i-share" xlink:href="#i-share"/></svg>分享</button>
    <button class="bb-btn primary"><svg><use href="#i-mic" xlink:href="#i-mic"/></svg>AI 分析</button>
    <button class="bb-btn"><svg><use href="#i-filter" xlink:href="#i-filter"/></svg>视图</button>
    <span class="bb-stats" id="bbStats"></span>
  </div>
</div>

<div class="m-top"><b>智能体议事厅</b></div>
<nav class="mobile-tab" id="mobileTab"></nav>

<script src="boluo-room-data.js?v=1"></script>
<script>
(function(){
const D=window.BoluoRoomData;
if(!D){document.getElementById('stream').innerHTML='<p>数据未加载</p>';return;}
const byId=new Map(D.messages.map(m=>[m.messageId,m]));
const agentByFrom=new Map(D.agents.map(a=>[a.from,a]));
const ICON={intel:'i-intel',relations:'i-rel',redteam:'i-red',measurement:'i-meas'};
const STATUS_COLOR={proposed:'#5b7390',challenged:'#e0644b',testing:'#d9a441',supported:'#1e9e8c',refuted:'#c0392b',retired:'#8aa0b8'};
const GRADE_COLOR={A:'#1e9e8c',B:'#2e7fd6',C:'#d9a441',D:'#e0644b'};
const GRADE_NAME={A:'可靠',B:'较可靠',C:'一般',D:'低信度'};
const state={selectedId:D.messages[0].messageId,view:'stream',filter:null};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtTime=t=>new Date(t).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
const agentKey=from=>from==='user'?'user':from.replace('agent.','');
const iconFor=from=>ICON[agentKey(from)]||'i-run';
const agentMeta=from=>agentByFrom.get(from)||{label:from,color:'#5b7390',role:''};

document.getElementById('agentNav').innerHTML=D.agents.filter(a=>a.from!=='user').map(a=>{
  const n=D.messages.filter(m=>m.from===a.from).length;
  return `<button class="nav-item" data-nav="${a.from}"><svg><use href="#${ICON[a.id]}" xlink:href="#${ICON[a.id]}"/></svg>${a.label}<span class="cnt">${n}</span></button>`;}).join('');
document.getElementById('mobileTab').innerHTML=
  `<button data-mtab="all" class="on"><svg><use href="#i-run" xlink:href="#i-run"/></svg>全部</button>`+
  D.agents.filter(a=>a.from!=='user').map(a=>`<button data-mtab="${a.from}"><svg><use href="#${ICON[a.id]}" xlink:href="#${ICON[a.id]}"/></svg>${a.label}</button>`).join('');
document.getElementById('qTitle').textContent='争论流 · 关键洞察';
document.getElementById('bbStats').innerHTML=`${D.metrics.total} 消息 · ${D.metrics.linked} 链接 · ${D.metrics.evidenceRefs} 证据 · 真实 run`;

function gradeRing(grade){
  const c=GRADE_COLOR[grade]||'#8aa0b8';
  return `<svg class="ring" viewBox="0 0 48 48"><circle cx="24" cy="24" r="19" stroke="rgba(28,78,138,.12)"/><circle cx="24" cy="24" r="19" stroke="${c}" stroke-dasharray="119.4" transform="rotate(-90 24 24)"/><text x="24" y="29" text-anchor="middle" font-size="15" font-weight="800" fill="${c}">${grade||'-'}</text></svg>`;
}

function renderStream(){
  const list=state.filter?D.messages.filter(m=>m.from===state.filter):D.messages;
  const cards=list.map(m=>{
    const a=agentMeta(m.from);const replies=D.messages.filter(x=>x.inReplyTo===m.messageId).length;
    return `<div class="msg ${m.messageId===state.selectedId?'sel':''}" data-id="${m.messageId}">
      <div class="msg-grid">
        <div class="msg-body">
          <div class="msg-head">
            <span class="avatar" style="background:${a.color}"><svg><use href="#${iconFor(m.from)}" xlink:href="#${iconFor(m.from)}"/></svg></span>
            <span class="who"><b>${a.label}</b><small>${fmtTime(m.timestamp)}</small></span>
            <span class="badge">
              <span class="dot-badge" style="color:${STATUS_COLOR[m.status]};background:${STATUS_COLOR[m.status]}1a;padding:3px 9px;border-radius:8px">${m.status}</span>
              <span class="grade-pill" style="color:${GRADE_COLOR[m.grade]||'#8aa0b8'};background:${(GRADE_COLOR[m.grade]||'#8aa0b8')}1a">${m.grade||'-'} ${GRADE_NAME[m.grade]||''}</span>
            </span>
          </div>
          <div class="stmt">${esc(m.payload.statement)}</div>
          <div class="det">${esc(m.payload.detail)}</div>
          <div class="tags"><span class="chip">${m.type}</span><span class="chip">置信 ${m.confidence||'-'}</span>${m.evidenceRefs.map(r=>`<span class="chip">${esc(r)}</span>`).join('')}</div>
          <div class="msg-actions">
            <span class="act"><svg><use href="#i-doc" xlink:href="#i-doc"/></svg>${m.evidenceRefs.length} 证据</span>
            <span class="act"><svg><use href="#i-comment" xlink:href="#i-comment"/></svg>${replies} 下游</span>
            ${m.inReplyTo?`<button class="act reply" data-jump="${m.inReplyTo}"><svg><use href="#i-sync" xlink:href="#i-sync"/></svg>引用 ${m.inReplyTo}</button>`:'<span class="act"><svg><use href="#i-heart" xlink:href="#i-heart"/></svg>起始</span>'}
          </div>
        </div>
        <div class="thumb">${gradeRing(m.grade)}<span class="tn">证据 ${m.evidenceRefs.length}</span><span class="ts">${m.type}</span></div>
      </div>
    </div>`;}).join('')||'<p>该分类暂无消息</p>';
  const composer=`<div class="composer"><button class="plus"><svg><use href="#i-plus" xlink:href="#i-plus"/></svg></button><input placeholder="基于证据提出你的观点…（研究版为只读，观点由四 Agent 生成）" disabled><button class="mic"><svg><use href="#i-mic" xlink:href="#i-mic"/></svg></button></div>`;
  document.getElementById('stream').innerHTML=`<div class="feed">${cards}</div>${composer}`;
}

function renderGraph(){
  const cols=['user','intel','relations','redteam','measurement'];
  const buckets=Object.fromEntries(cols.map(c=>[c,[]]));
  D.messages.forEach(m=>buckets[agentKey(m.from)].push(m));
  const pos=new Map();let maxRows=0;
  cols.forEach((c,ci)=>{buckets[c].forEach((m,ri)=>pos.set(m.messageId,{x:90+ci*205,y:55+ri*108,color:agentMeta(m.from).color}));maxRows=Math.max(maxRows,buckets[c].length);});
  const H=Math.max(360,maxRows*108+40);
  const edges=D.graph.edges.map(e=>{const s=pos.get(e.from),t=pos.get(e.to);if(!s||!t)return'';const mx=(s.x+t.x)/2;
    return `<path class="gedge" d="M${s.x} ${s.y} C${mx} ${s.y},${mx} ${t.y},${t.x} ${t.y}"/>`;}).join('');
  const nodes=[...pos.entries()].map(([id,p])=>`<g class="gnode ${id===state.selectedId?'sel':''}" data-id="${id}" transform="translate(${p.x},${p.y})"><circle r="15" stroke="${p.color}"/><text text-anchor="middle" y="34">${id.replace('msg_','')}</text></g>`).join('');
  document.getElementById('graphSvg').setAttribute('viewBox',`0 0 1010 ${H}`);
  document.getElementById('graphSvg').innerHTML=`<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#5b7390"/></marker></defs>${edges}${nodes}`;
}

function inspectorDonut(rows){
  const total=rows.reduce((s,r)=>s+r.value,0);let off=0;const R=34,C=2*Math.PI*R;
  const segs=rows.map(r=>{const frac=r.value/total,len=C*frac,el=`<circle r="${R}" cx="44" cy="44" fill="none" stroke="${GRADE_COLOR[r.label]||'#8aa0b8'}" stroke-width="13" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 44 44)"/>`;off+=len;return el;}).join('');
  const legend=rows.map(r=>`<div><span class="dot" style="background:${GRADE_COLOR[r.label]||'#8aa0b8'}"></span>${r.label} ${GRADE_NAME[r.label]||''} · ${Math.round(r.value/total*100)}%</div>`).join('');
  return `<div class="donut-wrap"><svg width="88" height="88" viewBox="0 0 88 88">${segs}</svg><div class="legend">${legend}</div></div>`;
}

function renderInspector(){
  const m=byId.get(state.selectedId);if(!m)return;
  const a=agentMeta(m.from);
  const reds=D.messages.filter(x=>x.from==='agent.redteam').slice(0,3);
  const tints=[['rgba(46,127,214,.12)','rgba(46,127,214,.3)','#2e7fd6'],['rgba(30,158,140,.12)','rgba(30,158,140,.3)','#1e9e8c'],['rgba(224,100,75,.12)','rgba(224,100,75,.3)','#e0644b']];
  const rtCards=reds.map((r,i)=>{const t=tints[i];
    return `<div class="rt-card" data-id="${r.messageId}" style="background:${t[0]};border-color:${t[1]}"><b style="color:${t[2]}">红队 · ${i+1}</b><small>${esc(r.payload.statement.slice(0,30))}…</small><span class="n" style="color:${t[2]}">${r.evidenceRefs.length} 条证据</span></div>`;}).join('');
  const tl=D.messages.slice(0,5).map(x=>`<div class="tl-item"><b>${agentMeta(x.from).label} · ${x.type}</b><small>${fmtTime(x.timestamp)} · ${esc(x.payload.statement.slice(0,18))}…</small></div>`).join('');
  const openQ=D.messages.find(x=>x.type==='question')||D.messages.find(x=>x.status==='proposed');
  const evCards=m.evidenceRefs.slice(0,3).map(r=>`<div class="ev-card"><svg><use href="#i-doc" xlink:href="#i-doc"/></svg><small>${esc(r)}</small></div>`).join('');
  document.getElementById('inspBody').innerHTML=`
    <div class="insp-sec"><div class="insp-head"><h3>证据分级</h3><a>查看全部</a></div>${inspectorDonut(D.charts.byGrade)}</div>
    <div class="insp-sec"><div class="insp-head"><h3>红队挑战</h3><a>查看全部</a></div><div class="rt-cards">${rtCards}</div></div>
    <div class="insp-sec"><div class="insp-head"><h3>状态时间线</h3><a>今天</a></div><div class="tl">${tl}</div></div>
    <div class="insp-sec"><div class="insp-head"><h3>下一步核验</h3><a>查看全部</a></div>
      <div class="check"><span class="cb"></span><div><b>${esc(openQ.payload.statement)}</b><small>待补一手台账或官方口径后再升级结论 · 证据：${openQ.evidenceRefs.join('、')}</small></div></div>
      <div class="ev-cards" style="margin-top:10px">${evCards}</div>
    </div>`;
}

function renderAll(){renderStream();renderGraph();renderInspector();}
function select(id){state.selectedId=id;renderAll();
  if(window.matchMedia('(max-width:900px)').matches)document.getElementById('inspector').classList.add('open');}

document.addEventListener('click',e=>{
  const jump=e.target.closest('[data-jump]');if(jump){select(jump.getAttribute('data-jump'));return;}
  const card=e.target.closest('.msg');if(card){select(card.getAttribute('data-id'));return;}
  const rt=e.target.closest('.rt-card');if(rt){select(rt.getAttribute('data-id'));return;}
  const gn=e.target.closest('.gnode');if(gn){select(gn.getAttribute('data-id'));}
});
function bindNav(sel){document.querySelectorAll(sel).forEach(btn=>btn.addEventListener('click',()=>{
  const v=btn.getAttribute(btn.hasAttribute('data-nav')?'data-nav':'data-mtab');
  state.filter=(v==='all'||v==='evidence')?null:v;
  document.querySelectorAll('.nav-item').forEach(x=>x.classList.toggle('active',x===btn));
  document.querySelectorAll('#mobileTab button').forEach(x=>x.classList.toggle('on',x===btn));
  renderStream();}));}
bindNav('[data-nav]');bindNav('[data-mtab]');
document.getElementById('tabStream').addEventListener('click',()=>{
  document.getElementById('tabStream').classList.add('on');document.getElementById('tabGraph').classList.remove('on');
  document.getElementById('stream').style.display='block';document.getElementById('graphWrap').classList.remove('on');});
document.getElementById('tabGraph').addEventListener('click',()=>{
  document.getElementById('tabGraph').classList.add('on');document.getElementById('tabStream').classList.remove('on');
  document.getElementById('stream').style.display='none';document.getElementById('graphWrap').classList.add('on');renderGraph();});
document.querySelector('.sheet-handle').addEventListener('click',()=>document.getElementById('inspector').classList.remove('open'));
document.querySelector('.m-top').addEventListener('click',()=>document.getElementById('inspector').classList.remove('open'));
renderAll();
})();
</script>
</body>
</html>
